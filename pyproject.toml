[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ritugyan"
version = "0.1.0"
description = "Regime-Aware AI Post-Processing of Monsoon Rainfall Forecasts for India"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RituGyan Team" }
]
keywords = [
    "meteorology",
    "monsoon",
    "weather-forecasting",
    "bias-correction",
    "ai-for-science",
    "imd",
    "india"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "xarray>=2023.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "rich>=13.6.0",
    "eccodes>=2.39.0",
    "ecmwflibs>=0.7.1",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
]
geo = [
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.8",
    "netCDF4>=1.6.0",
    "zarr>=2.16.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
]
ui = [
    "plotly>=5.17.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]
dev = [
    "black>=23.9.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests for isolated functions and classes",
    "integration: Integration tests between modules",
    "slow: Tests that take longer than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
